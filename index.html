<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="My Day" />
<meta name="theme-color" content="#0b0d12" />
<title>My Day — Time Tracker</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235b8def'/%3E%3Cg fill='none' stroke='white' stroke-width='7' stroke-linecap='round'%3E%3Ccircle cx='50' cy='52' r='30'/%3E%3Cpath d='M50 52V34M50 52l14 9'/%3E%3C/g%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0b0d12; --panel:#151922; --panel-2:#1c2230; --line:#262d3b;
    --text:#eef2f8; --muted:#8b93a7; --accent:#5b8def; --green:#34d399;
    --red:#f87171; --amber:#fbbf24; --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px; margin:0 auto; padding:18px 16px 120px}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
  h1{font-size:22px; font-weight:700; margin:0; letter-spacing:-.3px}
  .sub{color:var(--muted); font-size:13px; margin:2px 0 16px}

  .daynav{display:flex; align-items:center; gap:8px; margin-bottom:16px}
  .daynav button{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    width:40px; height:40px; border-radius:12px; font-size:18px; cursor:pointer;
  }
  .daynav .datebtn{flex:1; height:40px; text-align:center; font-weight:600; font-size:15px;
    display:flex; align-items:center; justify-content:center; position:relative}
  .daynav .datebtn input{position:absolute; inset:0; opacity:0; cursor:pointer}

  /* Summary cards */
  .cards{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:18px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 10px; text-align:center}
  .card .n{font-size:20px; font-weight:750; letter-spacing:-.5px}
  .card .l{font-size:11px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.4px}
  .card.free .n{color:var(--green)}
  .card.used .n{color:var(--accent)}

  /* Timeline */
  .section-title{font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase;
    letter-spacing:.5px; margin:22px 4px 10px}
  .timeline{position:relative; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px 10px 10px 52px; overflow:hidden}
  .tl-hour{position:relative; height:46px; border-top:1px dashed #232a37}
  .tl-hour:first-child{border-top:none}
  .tl-hour .lab{position:absolute; left:-44px; top:-8px; width:40px; text-align:right;
    font-size:11px; color:var(--muted)}
  .tl-block{position:absolute; left:54px; right:10px; border-radius:10px; padding:5px 9px;
    color:#fff; font-size:12.5px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.3);
    display:flex; flex-direction:column; justify-content:center; cursor:pointer}
  .tl-block b{font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tl-block small{opacity:.85; font-size:11px}
  .tl-now{position:absolute; left:46px; right:0; height:2px; background:var(--red); z-index:5}
  .tl-now::before{content:''; position:absolute; left:-4px; top:-3px; width:8px; height:8px;
    border-radius:50%; background:var(--red)}

  /* Free gaps list */
  .gap{display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:8px}
  .gap .time{font-weight:600; font-size:15px}
  .gap .dur{color:var(--green); font-weight:650; font-size:14px}
  .gap.small .dur{color:var(--muted)}

  .empty{color:var(--muted); font-size:14px; text-align:center; padding:18px}

  /* Block list */
  .blk{display:flex; align-items:center; gap:12px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px}
  .blk .dot{width:12px; height:12px; border-radius:50%; flex:none}
  .blk .info{flex:1; min-width:0}
  .blk .info b{font-size:15px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .blk .info span{color:var(--muted); font-size:13px}
  .blk .del{background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px 6px}

  /* Floating add button */
  .fab{position:fixed; bottom:calc(22px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--accent); color:#fff; border:none; border-radius:999px;
    padding:15px 26px; font-size:16px; font-weight:650; box-shadow:0 8px 24px rgba(91,141,239,.45);
    cursor:pointer; z-index:20; display:flex; align-items:center; gap:8px}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(3px);
    display:none; align-items:flex-end; justify-content:center; z-index:30}
  .overlay.show{display:flex}
  .sheet{background:var(--panel-2); width:100%; max-width:560px; border-radius:24px 24px 0 0;
    padding:20px 18px calc(28px + env(safe-area-inset-bottom)); border:1px solid var(--line); border-bottom:none}
  .sheet h2{margin:4px 0 18px; font-size:18px}
  label{display:block; font-size:13px; color:var(--muted); margin:14px 0 6px}
  input[type=text], input[type=time]{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:12px; padding:13px 14px; font-size:16px; font-family:inherit}
  .row{display:flex; gap:12px}
  .row > div{flex:1}
  .swatches{display:flex; gap:10px; margin-top:8px}
  .swatch{width:34px; height:34px; border-radius:50%; cursor:pointer; border:3px solid transparent}
  .swatch.sel{border-color:#fff}
  .sheet-actions{display:flex; gap:10px; margin-top:24px}
  .btn{flex:1; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:650; cursor:pointer}
  .btn.cancel{background:var(--panel); color:var(--text); border:1px solid var(--line)}
  .btn.save{background:var(--accent); color:#fff}
  .quick{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
  .quick button{background:var(--panel); border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:7px 12px; font-size:13px; cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>My Day</h1>
      <div class="sub" id="subtitle">Plan it. See what's left.</div>
    </div>
  </header>

  <div class="daynav">
    <button id="prevDay">‹</button>
    <div class="datebtn" id="dateLabel">
      <span id="dateText">Today</span>
      <input type="date" id="datePicker" />
    </div>
    <button id="nextDay">›</button>
  </div>

  <div class="cards">
    <div class="card used"><div class="n" id="usedH">0h</div><div class="l">Reserved</div></div>
    <div class="card free"><div class="n" id="freeH">0h</div><div class="l">Free left</div></div>
    <div class="card"><div class="n" id="blockCount">0</div><div class="l">Blocks</div></div>
  </div>

  <div class="section-title">Free time available</div>
  <div id="gaps"></div>

  <div class="section-title">Timeline</div>
  <div class="timeline" id="timeline"></div>

  <div class="section-title">Reserved blocks</div>
  <div id="blockList"></div>
</div>

<button class="fab" id="addBtn">＋ Reserve time</button>

<!-- Add/Edit sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">Reserve time</h2>
    <label>What is it?</label>
    <input type="text" id="fName" placeholder="e.g. Work, Gym, Lunch, Study" autocomplete="off" />
    <div class="quick" id="quickNames"></div>
    <div class="row">
      <div>
        <label>Start</label>
        <input type="time" id="fStart" />
      </div>
      <div>
        <label>End</label>
        <input type="time" id="fEnd" />
      </div>
    </div>
    <label>Color</label>
    <div class="swatches" id="swatches"></div>
    <div class="sheet-actions">
      <button class="btn cancel" id="cancelBtn">Cancel</button>
      <button class="btn save" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const COLORS = ["#5b8def","#34d399","#fbbf24","#f87171","#a78bfa","#f472b6","#22d3ee","#fb923c"];
  const QUICK = ["Work","Sleep","Gym","Lunch","Dinner","Study","Meeting","Commute","Break"];
  const DAY_START = 6;   // timeline visible window start hour
  const DAY_END   = 24;  // timeline visible window end hour (exclusive-ish)
  const STORE_KEY = "myday.blocks.v1";

  let current = new Date();      // selected day
  let editingId = null;
  let pickedColor = COLORS[0];

  /* ---------- storage ---------- */
  function load(){
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function save(data){ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  function dayKey(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function blocksForDay(){
    const all = load();
    const list = all[dayKey(current)] || [];
    return list.slice().sort((a,b)=>a.start-b.start);
  }
  function setBlocksForDay(list){
    const all = load();
    if(list.length) all[dayKey(current)] = list; else delete all[dayKey(current)];
    save(all);
  }

  /* ---------- helpers ---------- */
  function toMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
  function fromMin(m){
    m=((m%1440)+1440)%1440;
    const h=Math.floor(m/60), mm=m%60;
    return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0");
  }
  function fmt12(m){
    m=((m%1440)+1440)%1440;
    let h=Math.floor(m/60); const mm=m%60;
    const ap=h>=12?"PM":"AM"; h=h%12; if(h===0)h=12;
    return h+(mm? ":"+String(mm).padStart(2,"0"):"")+ap.toLowerCase();
  }
  function durStr(mins){
    if(mins<=0) return "0m";
    const h=Math.floor(mins/60), m=mins%60;
    return (h? h+"h":"")+(m? (h?" ":"")+m+"m":"") || "0m";
  }
  function isToday(){ const n=new Date(); return dayKey(n)===dayKey(current); }

  /* ---------- rendering ---------- */
  function render(){
    const list = blocksForDay();

    // date label
    const today = new Date(); today.setHours(0,0,0,0);
    const sel = new Date(current); sel.setHours(0,0,0,0);
    const diff = Math.round((sel-today)/86400000);
    let label;
    if(diff===0) label="Today";
    else if(diff===-1) label="Yesterday";
    else if(diff===1) label="Tomorrow";
    else label = current.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
    document.getElementById("dateText").textContent = label;
    document.getElementById("datePicker").value = dayKey(current);

    // free gaps within window (also drives the summary so numbers always add up)
    const gaps = computeGaps(list);
    const free = gaps.reduce((s,g)=>s+(g[1]-g[0]),0);
    const windowMins = (DAY_END-DAY_START)*60;
    const used = windowMins - free; // reserved time that falls within the day window
    document.getElementById("usedH").textContent = durStr(used);
    document.getElementById("freeH").textContent = durStr(free);
    document.getElementById("blockCount").textContent = list.length;

    renderGaps(gaps);
    renderTimeline(list);
    renderBlockList(list);
  }

  // merge overlapping reserved blocks (clipped to the visible window) and return the free gaps
  function computeGaps(list){
    const winS = DAY_START*60, winE = DAY_END*60;
    const busy = list.map(b=>[Math.max(b.start,winS), Math.min(b.end,winE)])
                     .filter(b=>b[1]>b[0]).sort((a,b)=>a[0]-b[0]);
    const merged=[];
    busy.forEach(b=>{
      if(merged.length && b[0]<=merged[merged.length-1][1])
        merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],b[1]);
      else merged.push(b.slice());
    });
    const gaps=[]; let cur=winS;
    merged.forEach(b=>{ if(b[0]>cur) gaps.push([cur,b[0]]); cur=Math.max(cur,b[1]); });
    if(cur<winE) gaps.push([cur,winE]);
    return gaps;
  }

  function renderGaps(gaps){
    const el = document.getElementById("gaps");
    el.innerHTML="";
    if(!gaps.length){ el.innerHTML='<div class="empty">No free time left in your day window 🎉</div>'; return; }
    gaps.forEach(g=>{
      const mins=g[1]-g[0];
      const d=document.createElement("div");
      d.className="gap"+(mins<30?" small":"");
      d.innerHTML='<span class="time">'+fmt12(g[0])+' – '+fmt12(g[1])+'</span>'+
                  '<span class="dur">'+durStr(mins)+' free</span>';
      el.appendChild(d);
    });
  }

  function renderTimeline(list){
    const tl=document.getElementById("timeline");
    tl.innerHTML="";
    const hours=DAY_END-DAY_START;
    const pxPerHour=46;
    for(let h=DAY_START; h<DAY_END; h++){
      const row=document.createElement("div");
      row.className="tl-hour";
      const lab=document.createElement("div");
      lab.className="lab";
      let hh=h%24; const ap=hh>=12?"p":"a"; let h12=hh%12; if(h12===0)h12=12;
      lab.textContent=h12+ap;
      row.appendChild(lab);
      tl.appendChild(row);
    }
    const winS=DAY_START*60, winE=DAY_END*60;
    list.forEach(b=>{
      const s=Math.max(b.start,winS), e=Math.min(b.end,winE);
      if(e<=s) return;
      const top=(s-winS)/60*pxPerHour + 10;
      const height=Math.max(20,(e-s)/60*pxPerHour - 4);
      const div=document.createElement("div");
      div.className="tl-block";
      div.style.top=top+"px";
      div.style.height=height+"px";
      div.style.background=b.color||COLORS[0];
      div.innerHTML='<b>'+escapeHtml(b.name)+'</b>'+
        (height>34?'<small>'+fmt12(b.start)+' – '+fmt12(b.end)+'</small>':'');
      div.onclick=()=>openSheet(b);
      tl.appendChild(div);
    });
    // now line
    if(isToday()){
      const now=new Date(); const nm=now.getHours()*60+now.getMinutes();
      if(nm>=winS && nm<=winE){
        const line=document.createElement("div");
        line.className="tl-now";
        line.style.top=((nm-winS)/60*pxPerHour+10)+"px";
        tl.appendChild(line);
      }
    }
  }

  function renderBlockList(list){
    const el=document.getElementById("blockList");
    el.innerHTML="";
    if(!list.length){ el.innerHTML='<div class="empty">Nothing reserved yet. Tap “Reserve time” to block out your commitments.</div>'; return; }
    list.forEach(b=>{
      const div=document.createElement("div");
      div.className="blk";
      div.innerHTML=
        '<span class="dot" style="background:'+(b.color||COLORS[0])+'"></span>'+
        '<div class="info"><b>'+escapeHtml(b.name)+'</b>'+
        '<span>'+fmt12(b.start)+' – '+fmt12(b.end)+' · '+durStr(b.end-b.start)+'</span></div>'+
        '<button class="del" data-id="'+b.id+'">🗑</button>';
      div.querySelector(".info").onclick=()=>openSheet(b);
      div.querySelector(".del").onclick=(ev)=>{ ev.stopPropagation(); removeBlock(b.id); };
      el.appendChild(div);
    });
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function removeBlock(id){
    const list=blocksForDay().filter(b=>b.id!==id);
    setBlocksForDay(list);
    render();
  }

  /* ---------- sheet ---------- */
  function buildSwatches(){
    const sw=document.getElementById("swatches");
    sw.innerHTML="";
    COLORS.forEach(c=>{
      const s=document.createElement("div");
      s.className="swatch"+(c===pickedColor?" sel":"");
      s.style.background=c;
      s.onclick=()=>{ pickedColor=c; buildSwatches(); };
      sw.appendChild(s);
    });
  }
  function buildQuick(){
    const q=document.getElementById("quickNames");
    q.innerHTML="";
    QUICK.forEach(n=>{
      const b=document.createElement("button");
      b.type="button"; b.textContent=n;
      b.onclick=()=>{ document.getElementById("fName").value=n; };
      q.appendChild(b);
    });
  }

  function openSheet(block){
    editingId = block ? block.id : null;
    document.getElementById("sheetTitle").textContent = block ? "Edit block" : "Reserve time";
    document.getElementById("fName").value = block ? block.name : "";
    if(block){
      document.getElementById("fStart").value = fromMin(block.start);
      document.getElementById("fEnd").value   = fromMin(block.end);
      pickedColor = block.color || COLORS[0];
    } else {
      // sensible default: next hour, 1h long
      const now=new Date();
      let sh=now.getHours()+1; if(sh>22) sh=22;
      document.getElementById("fStart").value=String(sh).padStart(2,"0")+":00";
      document.getElementById("fEnd").value=String(Math.min(sh+1,23)).padStart(2,"0")+":00";
      pickedColor = COLORS[blocksForDay().length % COLORS.length];
    }
    buildSwatches();
    document.getElementById("overlay").classList.add("show");
  }
  function closeSheet(){ document.getElementById("overlay").classList.remove("show"); editingId=null; }

  function saveBlock(){
    const name=document.getElementById("fName").value.trim() || "Reserved";
    const sv=document.getElementById("fStart").value;
    const ev=document.getElementById("fEnd").value;
    if(!sv||!ev){ alert("Please set a start and end time."); return; }
    let start=toMin(sv), end=toMin(ev);
    if(end<=start){ alert("End time must be after start time."); return; }
    let list=blocksForDay();
    if(editingId){
      list=list.map(b=>b.id===editingId?{...b,name,start,end,color:pickedColor}:b);
    } else {
      list.push({id:Date.now()+"_"+Math.random().toString(36).slice(2,7),name,start,end,color:pickedColor});
    }
    setBlocksForDay(list);
    closeSheet();
    render();
  }

  /* ---------- day nav ---------- */
  function shiftDay(n){ current.setDate(current.getDate()+n); render(); }

  /* ---------- wire up ---------- */
  document.getElementById("addBtn").onclick=()=>openSheet(null);
  document.getElementById("cancelBtn").onclick=closeSheet;
  document.getElementById("saveBtn").onclick=saveBlock;
  document.getElementById("overlay").onclick=(e)=>{ if(e.target.id==="overlay") closeSheet(); };
  document.getElementById("prevDay").onclick=()=>shiftDay(-1);
  document.getElementById("nextDay").onclick=()=>shiftDay(1);
  document.getElementById("datePicker").onchange=(e)=>{
    if(e.target.value){ const [y,m,d]=e.target.value.split("-").map(Number); current=new Date(y,m-1,d); render(); }
  };

  buildQuick();
  buildSwatches();
  render();
  // keep "now" line fresh
  setInterval(()=>{ if(isToday()) render(); }, 60000);
})();
</script>
</body>
</html>
